<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Portal - SkillBridge AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body { background: #F8FAFF!important; font-family: 'Inter', sans-serif!important; }
      h1, h2, h3 { font-family: 'Sora', sans-serif!important; }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">

    <div class="absolute top-0 left-0 w-full h-[500px] bg-gradient-to-b from-violet-100/60 via-purple-50/30 to-transparent pointer-events-none"></div>

    <!-- Navbar - White -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 p-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center shadow">
                <i class="fa-solid fa-building text-white text-xs"></i>
            </div>
            <h1 class="text-[14px] font-bold text-slate-900">SkillBridge AI | Recruiter & Hiring Hub</h1>
        </div>
        <a href="login.html" class="bg-white border border-slate-200 hover:bg-slate-50 text-[12px] px-4 py-2 rounded-xl transition font-medium text-slate-700 shadow-sm">← Back to Login</a>
    </nav>

    <!-- Main Container - White Card -->
    <div class="max-w-5xl mx-auto my-8 p-6 md:p-8 bg-white rounded-[24px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-200/80 relative z-10">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-6 border-b border-slate-100 pb-5">
            <div>
                <h2 class="text-[20px] font-bold text-slate-900">Post Job / Internship Opening</h2>
                <p class="text-[13px] text-slate-500 mt-1">AI candidate vector matching engine will automatically rank matching students.</p>
            </div>
            <span class="bg-violet-50 text-violet-600 text-[11px] px-3 py-1.5 rounded-full font-bold border border-violet-200 flex items-center gap-1.5">
                <i class="fa-solid fa-bolt"></i> Recruiter Mode ⚡
            </span>
        </div>

        <!-- Job Posting Form -->
        <form id="jobPostForm" class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-10">
            <div>
                <label class="block text-slate-700 text-[12px] font-semibold mb-2">Company Name</label>
                <input type="text" id="companyName" placeholder="e.g. TechCorp Global" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-violet-400 focus:bg-white text-slate-900 text-[13px] transition" required>
            </div>

            <div>
                <label class="block text-slate-700 text-[12px] font-semibold mb-2">Job / Role Title</label>
                <input type="text" id="jobTitle" placeholder="e.g. AI Research Intern / Full Stack Developer" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-violet-400 focus:bg-white text-slate-900 text-[13px] transition" required>
            </div>

            <div class="md:col-span-2">
                <label class="block text-slate-700 text-[12px] font-semibold mb-2">Required Skills / Domain Stack</label>
                <input type="text" id="reqSkills" placeholder="e.g. Python, Machine Learning, TensorFlow" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-violet-400 focus:bg-white text-slate-900 text-[13px] transition" required>
            </div>

            <div class="md:col-span-2">
                <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white p-3.5 rounded-xl font-semibold text-[13px] transition shadow-lg flex items-center justify-center gap-2">
                    Publish Opening & Run AI Candidate Matcher <i class="fa-solid fa-wand-magic-sparkles"></i>
                </button>
            </div>
        </form>

        <!-- AI Matched Candidates Section -->
        <div id="candidateResultsBox" class="border-t border-slate-100 pt-6 hidden">
            <h3 class="text-[15px] font-bold text-slate-900 mb-4 flex items-center gap-2">
                <span class="w-7 h-7 rounded-lg bg-violet-600 flex items-center justify-center text-white text-xs"><i class="fa-solid fa-robot"></i></span> Top AI-Ranked Student Candidates
            </h3>

            <div class="overflow-x-auto rounded-2xl border border-slate-200">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-[11px] uppercase font-bold">
                            <th class="p-4">Student Name</th>
                            <th class="p-4">Course / Department</th>
                            <th class="p-4">Match Score</th>
                            <th class="p-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="candidateTableBody" class="text-[13px] text-slate-700">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Recruiter Script -->
    <script>
        document.getElementById('jobPostForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const resultsBox = document.getElementById('candidateResultsBox');
            const tableBody = document.getElementById('candidateTableBody');

            resultsBox.classList.remove('hidden');
            tableBody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400 text-[13px]"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Scanning JIS University database for top vector matches...</td></tr>`;

            setTimeout(() => {
                tableBody.innerHTML = `
                    <tr class="border-b border-slate-100 hover:bg-slate-50/80">
                        <td class="p-4 font-semibold text-slate-900">Kamya Gupta</td>
                        <td class="p-4 text-slate-500 text-[12px]">B.Tech [CSE / AIML / Cyber Security]</td>
                        <td class="p-4"><span class="px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-full font-bold text-[11px] border border-emerald-200">98% Match</span></td>
                        <td class="p-4"><button onclick="alert('Interview invitation sent successfully to Kamya Gupta!')" class="px-3 py-1.5 bg-slate-900 hover:bg-black text-white text-[11px] rounded-lg font-medium transition">Shortlist / Hire</button></td>
                    </tr>
                    <tr class="border-b border-slate-100 hover:bg-slate-50/80">
                        <td class="p-4 font-semibold text-slate-900">Aarav Sharma</td>
                        <td class="p-4 text-slate-500 text-[12px]">Bachelor of Computer Application [BCA {Hons.}]</td>
                        <td class="p-4"><span class="px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-full font-bold text-[11px] border border-emerald-200">91% Match</span></td>
                        <td class="p-4"><button onclick="alert('Interview invitation sent successfully!')" class="px-3 py-1.5 bg-slate-900 hover:bg-black text-white text-[11px] rounded-lg font-medium transition">Shortlist / Hire</button></td>
                    </tr>
                    <tr class="hover:bg-slate-50/80">
                        <td class="p-4 font-semibold text-slate-900">Sneha Roy</td>
                        <td class="p-4 text-slate-500 text-[12px]">Bachelor of Pharmacy [B.Pharm]</td>
                        <td class="p-4"><span class="px-2.5 py-1 bg-blue-50 text-blue-600 rounded-full font-bold text-[11px] border border-blue-200">85% Match</span></td>
                        <td class="p-4"><button onclick="alert('Interview invitation sent successfully!')" class="px-3 py-1.5 bg-slate-900 hover:bg-black text-white text-[11px] rounded-lg font-medium transition">Shortlist / Hire</button></td>
                    </tr>
                `;
            }, 800);
        });
    </script>
</body>
</html>
