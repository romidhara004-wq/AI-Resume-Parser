<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillBridge AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body { background: #F8FAFF!important; font-family: 'Inter', sans-serif!important; }
      h1 { font-family: 'Sora', sans-serif!important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Light Mesh Background -->
    <div class="absolute top-0 left-0 w-full h-[600px] bg-gradient-to-b from-blue-100/70 via-indigo-50/40 to-transparent pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-200/20 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-[400px] bg-white border border-slate-200/80 rounded-[24px] p-8 shadow-[0_20px_60px_rgb(0,0,0,0.08)] relative z-10">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-slate-900 flex items-center justify-center mb-4 shadow-lg">
                <i class="fa-solid fa-bolt text-white text-xl"></i>
            </div>
            <h1 class="text-[18px] font-bold text-slate-900">SkillBridge AI Enterprise</h1>
            <p class="text-[12px] text-slate-500 mt-1">Sign in to continue to Dashboard</p>
        </div>

        <!-- Google Login -->
        <div class="mb-6">
            <div id="g_id_onload"
                 data-client_id="672376776099-bsgce42fa6o49l193etj07teanf74k5a.apps.googleusercontent.com"
                 data-context="signin"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin w-full"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>

        <div class="flex items-center gap-3 my-6">
            <div class="flex-1 h-px bg-slate-200"></div>
            <span class="text-[11px] text-slate-400 uppercase font-semibold">or continue with email</span>
            <div class="flex-1 h-px bg-slate-200"></div>
        </div>

        <!-- Manual Login Form -->
        <form onsubmit="handleManualLogin(event)" class="space-y-4">
            <div>
                <label class="text-[11px] text-slate-600 uppercase font-bold tracking-wider">Full Name</label>
                <input id="manualName" type="text" required placeholder="Enter your Full Name" class="w-full mt-1.5 p-3 bg-slate-50 border border-slate-200 rounded-xl text-[13px] text-slate-900 focus:border-blue-400 focus:bg-white outline-none transition placeholder:text-slate-400">
            </div>
            <div>
                <label class="text-[11px] text-slate-600 uppercase font-bold tracking-wider">Email</label>
                <input id="manualEmail" type="email" required placeholder="your@email.com" class="w-full mt-1.5 p-3 bg-slate-50 border border-slate-200 rounded-xl text-[13px] text-slate-900 focus:border-blue-400 focus:bg-white outline-none transition placeholder:text-slate-400">
            </div>
            <button type="submit" class="w-full bg-slate-900 text-white font-semibold py-3.5 rounded-xl text-[13px] hover:bg-black transition flex items-center justify-center gap-2 shadow-lg">
                Continue to Dashboard <i class="fa-solid fa-arrow-right text-[11px]"></i>
            </button>
        </form>

        <p class="text-[11px] text-slate-400 text-center mt-6">By continuing, you agree to SkillBridge Terms</p>
    </div>

<script>
function handleCredentialResponse(response){
  const user = JSON.parse(atob(response.credential.split('.')[1]));
  localStorage.setItem('userName', user.name);
  localStorage.setItem('userEmail', user.email);
  if(user.picture) localStorage.setItem('userPic', user.picture);
  window.location.href = "student-dashboard.html";
}

function handleManualLogin(e){
  e.preventDefault();
  const name = document.getElementById('manualName').value.trim();
  const email = document.getElementById('manualEmail').value.trim();
  if(!name) return alert("Please enter full name");
  localStorage.setItem('userName', name);
  localStorage.setItem('userEmail', email);
  window.location.href = "student-dashboard.html";
}
</script>
</body>
</html>
