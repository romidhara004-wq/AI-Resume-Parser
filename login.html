<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillBridge AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center mb-4">
                <i class="fa-solid fa-brain text-white text-xl"></i>
            </div>
            <h1 class="text-xl font-bold text-white">SkillBridge AI Enterprise</h1>
            <p class="text-xs text-slate-400 mt-1">Sign in to continue to Dashboard</p>
        </div>

        <!-- Google Login -->
        <div class="mb-6">
            <div id="g_id_onload"
                 data-client_id="672376776099-bsgce42fa6o49l193etj07teanf74k5a.apps.googleusercontent.com"
                 data-context="signin"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin w-full"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>

        <div class="flex items-center gap-3 my-6">
            <div class="flex-1 h-px bg-slate-800"></div>
            <span class="text-[11px] text-slate-500 uppercase">or continue with email</span>
            <div class="flex-1 h-px bg-slate-800"></div>
        </div>

        <!-- Manual Login Form -->
        <form onsubmit="handleManualLogin(event)" class="space-y-4">
            <div>
                <label class="text-[11px] text-slate-400 uppercase font-semibold">Full Name</label>
                <input id="manualName" type="text" required placeholder="Rankit Dhara" class="w-full mt-1.5 p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="text-[11px] text-slate-400 uppercase font-semibold">Email</label>
                <input id="manualEmail" type="email" required placeholder="your@email.com" class="w-full mt-1.5 p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:border-blue-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-white text-black font-bold py-3 rounded-xl text-sm hover:bg-slate-200 transition">
                Continue to Dashboard <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </form>

        <p class="text-[11px] text-slate-500 text-center mt-6">By continuing, you agree to SkillBridge Terms</p>
    </div>

<script>
function handleCredentialResponse(response){
  // Google ka token decode
  const user = JSON.parse(atob(response.credential.split('.')[1]));
  console.log("Google User:", user);

  // Sahi naam save karo - email prefix nahi
  localStorage.setItem('userName', user.name);
  localStorage.setItem('userEmail', user.email);
  if(user.picture) localStorage.setItem('userPic', user.picture);

  // Dashboard pe bhejo
  window.location.href = "student-dashboard.html";
}

function handleManualLogin(e){
  e.preventDefault();
  const name = document.getElementById('manualName').value.trim();
  const email = document.getElementById('manualEmail').value.trim();

  if(!name) return alert("Please enter full name");

  localStorage.setItem('userName', name);
  localStorage.setItem('userEmail', email);
  window.location.href = "student-dashboard.html";
}
</script>
<script src="public/theme.js"></script>
</body>
</html>
