<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge AI Enterprise - JIS University</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-md relative z-10">

        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center mx-auto mb-5 shadow-lg shadow-blue-500/30">
            <i class="fa-solid fa-brain text-white text-2xl"></i>
        </div>

        <div class="text-center mb-8">
            <h1 class="text-xl font-black bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">SkillBridge AI Enterprise</h1>
            <p class="text-xs text-slate-400 mt-1" id="formSubtitle">JIS University Neural Matrix Portal</p>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-envelope text-xs"></i></span>
                    <input type="email" id="userEmail" placeholder="Enter your email" class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500 text-white text-xs" required>
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-lock text-xs"></i></span>
                    <input type="password" id="userPassword" placeholder="Enter your password" class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500 text-white text-xs" required>
                </div>
            </div>
            <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold text-xs shadow-lg flex items-center justify-center gap-2"><i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard</button>
        </form>

        <!-- REGISTER FORM (Hidden by default) -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-5 hidden">
            <div>
                <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-2">Full Name</label>
                <input type="text" id="regName" placeholder="Your Name" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500 text-white text-xs" required>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" id="regEmail" placeholder="Enter your email" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500 text-white text-xs" required>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                <input type="password" id="regPassword" placeholder="Create password" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500 text-white text-xs" required>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-2">Role</label>
                <select id="regRole" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500 text-white text-xs">
                    <option value="student">Student</option>
                    <option value="recruiter">Recruiter / Company</option>
                </select>
            </div>
            <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold text-xs shadow-lg flex items-center justify-center gap-2"><i class="fa-solid fa-user-plus"></i> Create Account</button>
        </form>

        <div class="text-center mt-6 text-xs text-slate-400">
            <span id="toggleText">New user? </span><a href="#" onclick="toggleForm()" id="toggleLink" class="text-blue-400 font-semibold hover:underline">Create an account</a>
        </div>
        <div class="text-center mt-6 pt-4 border-t border-slate-800/60 text-[10px] text-slate-500">Protected by JIS University Neural Matrix Security v4.2</div>
    </div>

<script>
    const BASE_URL = window.location.hostname.includes('localhost')
       ? 'http://localhost:5000'
        : 'https://skillbridge-ai-sf60.onrender.com';

    function toggleForm(){
        document.getElementById('loginForm').classList.toggle('hidden');
        document.getElementById('registerForm').classList.toggle('hidden');
        const isLogin =!document.getElementById('loginForm').classList.contains('hidden');
        document.getElementById('toggleText').innerText = isLogin? 'New user? ' : 'Already have account? ';
        document.getElementById('toggleLink').innerText = isLogin? 'Create an account' : 'Sign In';
        document.getElementById('formSubtitle').innerText = isLogin? 'JIS University Neural Matrix Portal' : 'Create your Neural Access';
    }

    async function handleLogin(e){
        e.preventDefault();
        const email = document.getElementById('userEmail').value.trim();
        const password = document.getElementById('userPassword').value.trim();
        const btn = e.target.querySelector('button');
        btn.innerHTML = 'Checking...'; btn.disabled = true;
        try{
            const res = await fetch(`${BASE_URL}/api/auth/login`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if(!res.ok){ alert(data.message||'Login failed'); throw new Error(data.message); }
            localStorage.setItem('token', data.token);
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userName', data.user?.name || email.split('@')[0]);
            localStorage.setItem('userRole', data.user?.role);
            window.location.href = data.user?.role === 'recruiter'? "company-dashboard.html" : "student-dashboard.html";
        }catch(err){ alert('Server Error: '+err.message); }
        finally{ btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard'; btn.disabled = false; }
    }

    async function handleRegister(e){
        e.preventDefault();
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const role = document.getElementById('regRole').value;
        const btn = e.target.querySelector('button');
        btn.innerHTML = 'Creating...'; btn.disabled = true;
        try{
            const res = await fetch(`${BASE_URL}/api/auth/register`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ name, email, password, role })
            });
            const data = await res.json();
            if(!res.ok){ alert(data.message||'Register failed'); return; }
            alert('Account Created! Please Login now.');
            toggleForm();
        }catch(err){ alert('Server se connect nahi ho pa raha: '+err.message); }
        finally{ btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account'; btn.disabled = false; }
    }
</script>
</body>
</html>
