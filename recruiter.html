<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recruiter Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
<nav class="bg-white border-b px-6 py-4 flex justify-between sticky top-0">
<div class="font-bold">HR Portal - Debug Mode</div>
<div class="flex gap-2"><button onclick="render()" class="bg-slate-900 text-white px-4 py-1.5 rounded-full text-xs">Refresh ↻</button><button onclick="if(confirm('Clear?')){localStorage.clear();render()}" class="bg-red-50 text-red-600 border border-red-200 px-3 py-1.5 rounded-full text-xs">Clear All</button></div>
</nav>
<main class="max-w-6xl mx-auto p-4 grid lg:grid-cols-3 gap-6 mt-4">
<div class="bg-white p-6 rounded-2xl border">
<h3 class="font-bold text-sm mb-3">Post Drive (Optional)</h3>
<form onsubmit="postJob(event)" class="space-y-3">
<input id="c" placeholder="Google" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs" required>
<input id="r" placeholder="AI Intern" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs" required>
<input id="s" placeholder="50k/month" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs" required>
<input id="l" placeholder="Kolkata" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs" required>
<textarea id="d" placeholder="Python, AI" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs"></textarea>
<button class="w-full bg-slate-900 text-white py-3 rounded-xl text-xs font-bold">Broadcast Drive</button>
</form>
<div class="mt-4 p-3 bg-yellow-50 border border-yellow-200 rounded-xl text-[11px] font-mono break-words">
<p class="font-bold mb-1">DEBUG INFO (Isse screenshot bhejo):</p>
<p id="debug"></p>
</div>
</div>
<div class="lg:col-span-2 bg-white p-6 rounded-2xl border">
<div class="flex justify-between items-center border-b pb-3 mb-4"><h3 class="font-bold text-sm">Incoming Student Applications (<span id="count">0</span>)</h3></div>
<div id="list" class="space-y-3"></div>
</div>
</main>
<script>
function postJob(e){e.preventDefault(); let jobs=JSON.parse(localStorage.getItem('customPostedJobs')||'[]'); jobs.push({company:document.getElementById('c').value,role:document.getElementById('r').value,salary:document.getElementById('s').value,location:document.getElementById('l').value,desc:document.getElementById('d').value,id:Date.now()}); localStorage.setItem('customPostedJobs',JSON.stringify(jobs)); e.target.reset(); render(); alert('Drive Created!');}

function render(){
let debugEl=document.getElementById('debug');
let listEl=document.getElementById('list');
let countEl=document.getElementById('count');
let allKeys = [];
for(let i=0;i<localStorage.length;i++) allKeys.push(localStorage.key(i));
let allApps=[];
let drives=JSON.parse(localStorage.getItem('customPostedJobs')||'[]');
for(let k of allKeys){
 if(k.includes('applied') || k.includes('student') || k.includes('Jobs')){
   try{let arr=JSON.parse(localStorage.getItem(k)||'[]'); if(Array.isArray(arr)) allApps=allApps.concat(arr.map(x=>({...x,_fromKey:k})));}catch(e){}
 }
}
debugEl.innerHTML=`Total Keys: ${localStorage.length}<br>Keys: ${allKeys.join(', ')||'EMPTY'}<br><br>Drives in customPostedJobs: ${drives.length}<br>Apps found total: ${allApps.length}<br><br>Raw data:<br>${JSON.stringify(allApps).substring(0,800)}`;

countEl.innerText=allApps.length;
if(allApps.length===0){
 listEl.innerHTML=`<div class="text-center py-16 bg-slate-50 rounded-2xl border-dashed border-2"><p class="text-3xl mb-2">📭</p><p class="font-bold text-sm">No Applications Yet</p><p class="text-xs text-slate-500 mt-1">1. Same website pe raho (er.com ya localhost)<br>2. jobs.html pe Apply karo<br>3. Yaha Refresh click karo</p><p class="text-[10px] mt-3 text-slate-400">If drives still 0 after creating, your browser is blocking localStorage. Try Chrome normal mode, not incognito.</p></div>`;
 return;
}
listEl.innerHTML="";
allApps.forEach(app=>{
 let div=document.createElement('div');
 div.className="p-4 border rounded-2xl flex justify-between";
 div.innerHTML=`<div><p class="text-[10px] text-violet-600 font-bold uppercase">${app.company} (from ${app._fromKey})</p><p class="font-bold text-[13px]">${app.name||'Student'} - ${app.role}</p><p class="text-[11px] text-slate-500">${app.course||''} | ${app.date||''}</p></div><span class="px-3 py-1 bg-emerald-50 text-emerald-600 border rounded-full text-[11px] h-fit">${app.status||'Under Review'}</span>`;
 listEl.appendChild(div);
});
}
window.onload=render;
</script>
</body>
</html>
