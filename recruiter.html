<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR & Recruiter Portal - SkillBridge AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{background:#F8FAFF!important;font-family:'Inter',sans-serif!important}h1,h2,h3{font-family:'Sora',sans-serif!important}</style>
</head>
<body class="min-h-screen">
<nav class="bg-white border-b sticky top-0 z-40 px-6 py-4 flex justify-between items-center shadow-sm">
<div class="flex items-center space-x-3"><div class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center text-white"><i class="fa-solid fa-building-user text-sm"></i></div><div><h1 class="font-bold text-[14px]">HR & Recruiter Portal</h1><p class="text-[11px] text-slate-500">JIS University Placement Matrix</p></div></div>
<div class="flex items-center gap-2"><button onclick="render()" class="text-[11px] bg-white border px-3 py-1.5 rounded-full">Refresh ↻</button><button onclick="if(confirm('Clear all applications?')){localStorage.removeItem('studentApplications'); render();}" class="bg-red-50 border border-red-200 text-red-600 text-[11px] px-3 py-1.5 rounded-xl">Clear All</button></div>
</nav>

<main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-6">
<div class="bg-white p-7 rounded-[24px] border shadow-sm h-fit">
<h3 class="font-bold text-[13px] mb-4 pb-3 border-b flex items-center gap-2"><i class="fa-solid fa-briefcase text-violet-600"></i> Post Placement Drive</h3>
<form onsubmit="postNewJob(event)" class="space-y-4">
<input type="text" id="companyName" placeholder="Company Name e.g. Google" class="w-full p-3 bg-slate-50 border rounded-xl text-[12px]" required>
<input type="text" id="jobRole" placeholder="Job Role e.g. AI Intern" class="w-full p-3 bg-slate-50 border rounded-xl text-[12px]" required>
<input type="text" id="jobSalary" placeholder="Salary e.g. ₹50k/month" class="w-full p-3 bg-slate-50 border rounded-xl text-[12px]" required>
<input type="text" id="jobLocation" placeholder="Location" class="w-full p-3 bg-slate-50 border rounded-xl text-[12px]" required>
<textarea id="jobDesc" rows="3" placeholder="Requirements..." class="w-full p-3 bg-slate-50 border rounded-xl text-[12px]" required></textarea>
<button type="submit" class="w-full py-3.5 bg-slate-900 text-white rounded-xl text-[12px] font-bold">Broadcast Drive Live 🚀</button>
</form>
</div>

<div class="lg:col-span-2">
<div class="bg-white p-7 rounded-[24px] border shadow-sm">
<div class="flex justify-between items-center mb-4 pb-3 border-b"><h3 class="font-bold text-[13px] flex items-center gap-2"><i class="fa-solid fa-users text-violet-600"></i> Incoming Student Applications (<span id="count">0</span>)</h3></div>
<div id="recruiterList" class="space-y-3"></div>
</div>
</div>
</main>

<script>
function postNewJob(e){
 e.preventDefault();
 const data={company:document.getElementById('companyName').value, role:document.getElementById('jobRole').value, salary:document.getElementById('jobSalary').value, location:document.getElementById('jobLocation').value, desc:document.getElementById('jobDesc').value, id:'job-'+Date.now()};
 let jobs=JSON.parse(localStorage.getItem('customPostedJobs')||'[]'); jobs.push(data); localStorage.setItem('customPostedJobs', JSON.stringify(jobs));
 e.target.reset(); render(); alert("Drive Published: "+data.company);
}
function render(){
 const container=document.getElementById('recruiterList');
 const count=document.getElementById('count');
 let allApps=JSON.parse(localStorage.getItem('studentApplications')||'[]');
 // Deduplicate
 let unique = new Map();
 allApps.forEach(a=>{ let k = a.company+'_'+a.role+'_'+(a.name||''); if(!unique.has(k)) unique.set(k,a); });
 allApps = Array.from(unique.values());
 count.innerText=allApps.length;
 if(allApps.length===0){
   container.innerHTML=`<div class="text-center py-16 bg-slate-50 rounded-[20px] border border-dashed"><div class="text-[32px] mb-3">📭</div><h3 class="font-bold text-[14px]">No Applications Yet</h3><p class="text-[12px] text-slate-500 mt-1">Applications will appear here once students apply</p></div>`;
   return;
 }
 container.innerHTML="";
 allApps.forEach(app=>{
  const div=document.createElement('div');
  div.className="p-4 rounded-2xl bg-white border flex justify-between items-center gap-4";
  div.innerHTML=`<div><span class="text-[10px] text-violet-600 font-bold uppercase">${app.company}</span><h4 class="font-bold text-[13px]">${app.name} - <span class="text-blue-600">${app.role}</span></h4><p class="text-[11px] text-slate-500">${app.course||'B.Tech CSE [AIML]'} | ${app.date||''}</p></div><div class="flex items-center gap-2"><span class="px-3 py-1.5 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-xl text-[11px] font-bold">${app.status||'Under Review'}</span><button onclick="updateStatus('${app.id}','Accepted')" class="px-2.5 py-1.5 bg-green-600 text-white rounded-lg text-[10px] font-bold">Accept</button><button onclick="updateStatus('${app.id}','Rejected')" class="px-2.5 py-1.5 bg-red-600 text-white rounded-lg text-[10px] font-bold">Reject</button></div>`;
  container.appendChild(div);
 });
}
function updateStatus(id, status){
 let apps=JSON.parse(localStorage.getItem('studentApplications')||'[]');
 apps=apps.map(a=>{ if(String(a.id)===String(id)) a.status=status; return a; });
 localStorage.setItem('studentApplications', JSON.stringify(apps));
 render();
}
window.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
