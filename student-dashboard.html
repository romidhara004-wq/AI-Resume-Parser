<script>
    let isResumeUploaded = false;
    let uploadedFileName = "";
    let dynamicFileSummary = "";

    // Page load pe naam set karo - simple logic
    window.addEventListener('DOMContentLoaded', () => {
        try {
            let name = localStorage.getItem('userName') || "";
            // Agar naam me @ hai ya bahut chhota hai to usko Student dikhao
            if (name.includes('@') || name.length < 2) {
                name = "";
            }

            if (name) {
                document.getElementById('welcomeHeading').innerText = `Welcome back, ${name} 🎓`;
                document.getElementById('fullName').value = name;
            } else {
                document.getElementById('welcomeHeading').innerText = `Welcome back, Student 🎓`;
                document.getElementById('fullName').value = "";
            }
        } catch (e) {
            console.log("Load error:", e);
            document.getElementById('welcomeHeading').innerText = `Welcome back, Student 🎓`;
        }
    });

    function updateWelcomeName(val) {
        const display = val.trim()? val.trim() : "Student";
        document.getElementById('welcomeHeading').innerText = `Welcome back, ${display} 🎓`;
        if (val.trim()) {
            localStorage.setItem('userName', val.trim());
        }
    }

    function checkCustomSkill(val) {
        const box = document.getElementById('customSkillBox');
        if (val === 'other') box.classList.remove('hidden');
        else box.classList.add('hidden');
    }

    async function handleResumeUpload(input) {
        if (!input.files[0]) return;
        const file = input.files[0];
        uploadedFileName = file.name;
        document.getElementById('uploadText').innerText = "⏳ Parsing...";

        // Simple demo parsing for now
        setTimeout(() => {
            isResumeUploaded = true;
            document.getElementById('uploadText').innerText = "✅ " + file.name;
            document.getElementById('uploadSubText').innerText = "Parsed Successfully!";
            document.getElementById('alertBox').classList.add('hidden');
            const curName = document.getElementById('fullName').value || "Candidate";
            dynamicFileSummary = `File: ${file.name}\nCandidate: ${curName}\nSize: ${(file.size/1024).toFixed(1)} KB\nStatus: SUCCESS`;
            showReport();
        }, 600);
    }

    function executeAnalysis(e) {
        e.preventDefault();
        const finalName = document.getElementById('fullName').value.trim();
        if (finalName) localStorage.setItem('userName', finalName);

        if (!isResumeUploaded) {
            document.getElementById('alertBox').classList.remove('hidden');
            document.getElementById('alertBox').scrollIntoView({ behavior: 'smooth' });
            return;
        }
        showReport();
    }

    function showReport() {
        document.getElementById('reportFileName').innerText = uploadedFileName;
        document.getElementById('reportExtractedSkills').innerText = dynamicFileSummary;
        document.getElementById('aiReportBox').classList.remove('hidden');
        document.getElementById('aiReportBox').scrollIntoView({ behavior: 'smooth' });
    }
</script>
